name: Build and Sync CV

on:
  push:
    branches: [main]
    paths:
      - 'overleaf/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      HOWZYSOLUTIONS_DEPLOY_TOKEN: ${{ secrets.HOWZYSOLUTIONS_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Tectonic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_url=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/tectonic-typesetting/tectonic/releases/latest | jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-gnu.*\\.tar\\.gz$")) | .browser_download_url' | head -n 1)
          test -n "$asset_url"
          curl -sSL "$asset_url" | tar -xz -C /tmp
          sudo mv /tmp/tectonic /usr/local/bin/
          tectonic --version

      - name: Compile LaTeX to PDF
        run: |
          mkdir -p /tmp/cv-build
          cd overleaf
          tectonic -X compile main.tex --outdir /tmp/cv-build
          cp /tmp/cv-build/main.pdf ../files/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf
          tectonic -X compile main-pt.tex --outdir /tmp/cv-build
          cp /tmp/cv-build/main-pt.pdf ../files/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf
          cd ..
          ls -lh files/

      - name: Commit and push compiled PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add files/*.pdf
          if git diff --staged --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "chore(cv): compile latest PDFs [skip ci]"
            git push
          fi

      - name: Upload PDFs to Cloudflare R2
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 20be850405e672a89316739f155c6853
        run: |
          npx wrangler r2 object put "howzysolutions/cv/eng/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf" --file "files/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf" --content-type "application/pdf" --content-disposition "inline" --remote
          npx wrangler r2 object put "howzysolutions/cv/ptbr/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf" --file "files/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf" --content-type "application/pdf" --content-disposition "inline" --remote
          npx wrangler r2 object put "howzysolutions/cv/eng/cv.pdf" --file "files/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf" --content-type "application/pdf" --content-disposition "inline" --remote
          npx wrangler r2 object put "howzysolutions/cv/ptbr/cv.pdf" --file "files/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf" --content-type "application/pdf" --content-disposition "inline" --remote

      - name: Trigger howzysolutions deployment
        if: env.HOWZYSOLUTIONS_DEPLOY_TOKEN != ''
        env:
          HOWZYSOLUTIONS_DEPLOY_TOKEN: ${{ secrets.HOWZYSOLUTIONS_DEPLOY_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.HOWZYSOLUTIONS_DEPLOY_TOKEN }}" \
            https://api.github.com/repos/H0wZy/howzysolutions/dispatches \
            -d '{"event_type":"cv_updated","client_payload":{"commit":"${{ github.sha }}"}}'
          echo "Dispatched cv_updated event to H0wZy/howzysolutions"
