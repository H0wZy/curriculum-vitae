name: Build and Sync CV

on:
  push:
    branches: [main]
    paths:
      - 'overleaf/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HOWZYSOLUTIONS_DEPLOY_TOKEN: ${{ secrets.HOWZYSOLUTIONS_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tectonic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          asset_url=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/repos/tectonic-typesetting/tectonic/releases/latest | jq -r '.assets[] | select(.name | test("x86_64-unknown-linux-gnu.*\\.tar\\.gz$")) | .browser_download_url' | head -n 1)
          test -n "$asset_url"
          curl -sSL "$asset_url" | tar -xz -C /tmp
          sudo mv /tmp/tectonic /usr/local/bin/
          tectonic --version

      - name: Compile LaTeX to PDF
        run: |
          mkdir -p /tmp/cv-build
          cd overleaf
          tectonic -X compile main.tex --outdir /tmp/cv-build
          cp /tmp/cv-build/main.pdf ../files/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf
          tectonic -X compile main-pt.tex --outdir /tmp/cv-build
          cp /tmp/cv-build/main-pt.pdf ../files/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf
          cd ..
          ls -lh files/

      - name: Commit and push compiled PDFs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add files/*.pdf
          if git diff --staged --quiet; then
            echo "No PDF changes to commit"
          else
            git commit -m "chore(cv): compile latest PDFs [skip ci]"
            git push
          fi

      - name: Upload PDFs to Cloudflare R2
        if: env.R2_ACCESS_KEY_ID != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp files/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf s3://howzysolutions/cv/eng/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf --endpoint-url $ENDPOINT --content-type application/pdf
          aws s3 cp files/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf s3://howzysolutions/cv/ptbr/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf --endpoint-url $ENDPOINT --content-type application/pdf
          aws s3 cp files/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf s3://howzysolutions/cv/ENG_CV_Marcos_Junior_Bueno_Selzler.pdf --endpoint-url $ENDPOINT --content-type application/pdf
          aws s3 cp files/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf s3://howzysolutions/cv/PTBR_CV_Marcos_Junior_Bueno_Selzler.pdf --endpoint-url $ENDPOINT --content-type application/pdf

      - name: Trigger howzysolutions deployment
        if: env.HOWZYSOLUTIONS_DEPLOY_TOKEN != ''
        env:
          HOWZYSOLUTIONS_DEPLOY_TOKEN: ${{ secrets.HOWZYSOLUTIONS_DEPLOY_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.HOWZYSOLUTIONS_DEPLOY_TOKEN }}" \
            https://api.github.com/repos/H0wZy/howzysolutions/dispatches \
            -d '{"event_type":"cv_updated","client_payload":{"commit":"${{ github.sha }}"}}'
          echo "Dispatched cv_updated event to H0wZy/howzysolutions"
